<div id="companySettingsOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:12px;max-width:420px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,0.2);overflow:hidden;">
    <div style="padding:18px 20px 12px;border-bottom:1px solid var(--border);">
      <strong style="font-size:14px;color:var(--text);">🏢 Company Settings</strong>
    </div>
    <form id="companySettingsForm" style="padding:16px 20px;">
      <div class="field" style="margin-bottom:14px;">
        <label for="companyNameInput" style="display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px;">Company Name</label>
        <input type="text" id="companyNameInput" style="width:100%;padding:8px 10px;font-size:13px;border:1.5px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);">
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="logoUpload" style="display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px;">Company Logo</label>
        <input type="file" id="logoUpload" name="logo" accept="image/*" style="font-size:12px;color:var(--text);">
        <div id="logoPreview" style="margin-top:8px;max-width:150px;max-height:60px;display:none;"></div>
        <button type="button" id="removeLogoBtn" style="display:none;margin-top:6px;background:none;border:1px solid var(--error);color:var(--error);border-radius:4px;padding:3px 10px;font-size:10px;font-weight:600;cursor:pointer;">Remove Logo</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" id="companySettingsCancel" style="background:#f1f1f0;color:var(--text);border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;">Cancel</button>
        <button type="submit" id="companySettingsSave" style="background:var(--accent);color:white;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;">Save</button>
      </div>
    </form>
  </div>
</div>
<script>
function openCompanySettings() {
  var overlay = document.getElementById('companySettingsOverlay');
  overlay.style.display = 'flex';

  google.script.run
    .withSuccessHandler(function (info) {
      document.getElementById('companyNameInput').value = info.name || 'United Ocean Trading and Services';
      if (info.logoFileId) {
        var preview = document.getElementById('logoPreview');
        preview.innerHTML = '<img src="https://drive.google.com/uc?export=view&id=' + info.logoFileId + '" style="max-width:150px;max-height:60px;">';
        preview.style.display = 'block';
        document.getElementById('removeLogoBtn').style.display = '';
      } else {
        document.getElementById('logoPreview').style.display = 'none';
        document.getElementById('removeLogoBtn').style.display = 'none';
      }
    })
    .getCompanyInfo();
}

document.getElementById('companySettingsForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = document.getElementById('companySettingsSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  var fileInput = document.getElementById('logoUpload');
  var hasFile = fileInput && fileInput.files && fileInput.files.length > 0;

  if (hasFile) {
    var reader = new FileReader();
    reader.onload = function (loadEvent) {
      var base64 = loadEvent.target.result.split(',')[1];
      var formData = {
        companyName: document.getElementById('companyNameInput').value,
        logo: { bytes: base64, mimeType: fileInput.files[0].type }
      };
      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;
          btn.textContent = 'Save';
          if (result.success) {
            document.getElementById('companySettingsOverlay').style.display = 'none';
            showStatus('success', result.message);
          } else {
            showStatus('error', result.error);
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'Save';
          showStatus('error', err.message || String(err));
        })
        .saveCompanyInfo(formData);
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    var formData = {
      companyName: document.getElementById('companyNameInput').value,
      logo: null
    };
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Save';
        if (result.success) {
          document.getElementById('companySettingsOverlay').style.display = 'none';
          showStatus('success', result.message);
        } else {
          showStatus('error', result.error);
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Save';
        showStatus('error', err.message || String(err));
      })
      .saveCompanyInfo(formData);
  }
});

document.getElementById('companySettingsCancel').addEventListener('click', function () {
  document.getElementById('companySettingsOverlay').style.display = 'none';
});

document.getElementById('removeLogoBtn').addEventListener('click', function () {
  google.script.run
    .withSuccessHandler(function () {
      document.getElementById('logoPreview').innerHTML = '';
      document.getElementById('logoPreview').style.display = 'none';
      document.getElementById('removeLogoBtn').style.display = 'none';
      document.getElementById('logoUpload').value = '';
      showStatus('success', 'Logo removed.');
    })
    .removeCompanyLogo();
});

document.getElementById('companySettingsOverlay').addEventListener('click', function (e) {
  if (e.target === this) this.style.display = 'none';
});
</script>
