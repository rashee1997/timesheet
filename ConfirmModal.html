<div id="confirmModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:12px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,0.2);">
    <div style="padding:18px 20px 12px;font-size:14px;line-height:1.5;color:var(--text);" id="confirmModalMessage"></div>
    <div style="padding:8px 20px 16px;display:flex;gap:10px;justify-content:flex-end;">
      <button type="button" id="confirmModalCancel" style="background:#f1f1f0;color:var(--text);border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;">Cancel</button>
      <button type="button" id="confirmModalOk" style="background:var(--confirm);color:white;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;">Yes, continue</button>
    </div>
  </div>
</div>
<script>
var confirmModalResolve = null;

function showConfirmModal(html) {
  return new Promise(function (resolve) {
    document.getElementById('confirmModalMessage').innerHTML = html;
    document.getElementById('confirmModalOverlay').style.display = 'flex';
    confirmModalResolve = resolve;
  });
}

document.getElementById('confirmModalOk').addEventListener('click', function () {
  document.getElementById('confirmModalOverlay').style.display = 'none';
  if (confirmModalResolve) { confirmModalResolve(true); confirmModalResolve = null; }
});

document.getElementById('confirmModalCancel').addEventListener('click', function () {
  document.getElementById('confirmModalOverlay').style.display = 'none';
  if (confirmModalResolve) { confirmModalResolve(false); confirmModalResolve = null; }
});

document.getElementById('confirmModalOverlay').addEventListener('click', function (e) {
  if (e.target === this) {
    this.style.display = 'none';
    if (confirmModalResolve) { confirmModalResolve(false); confirmModalResolve = null; }
  }
});
</script>
